name: CI

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - "README.md"
  push:
    paths-ignore:
      - "README.md"

jobs:
  ci:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:

          # Linux Targets
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: ubuntu-latest
            target: armv7-unknown-linux-gnueabihf
          - os: ubuntu-latest
            target: arm-unknown-linux-gnueabihf
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu

          # MacOS targets
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin

          # Windows targets
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            target: aarch64-pc-windows-msvc

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust
        run: |
          rustup update
          rustup target add ${{ matrix.target }}

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          key: ${{ matrix.target }}

      - name: MacOS: Install protobuf
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Windows: Install protobuf
        if: runner.os == 'Windows'
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: "30.x" # https://github.com/protocolbuffers/protobuf/releases/latest

      - name: Build binary for Windows, MacOS
        if: runner.os != 'Linux'
        run: |
          cargo update --color=always
          cargo build --release --target=${{ matrix.target }} --color=always

      - name: Build binary for Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y protobuf-compiler
          cargo update --color=always
          CC=clang cargo build --release --target=${{ matrix.target }} --color=always

      - name: Check code formatting
        continue-on-error: true
        run: cargo fmt --all -- --check

      - name: Run clippy
        continue-on-error: true
        run: cargo clippy -- -D warnings

      - name: Package for Linux, MacOS
        if: runner.os != 'Windows'
        run: |
          tar -cv
          LICENSE README.md
          -C target/${{ matrix.target }}/release/ otadump
          | gzip --best
          > 'otadump-${{ steps.get_version.outputs.value }}-${{ matrix.target }}.tar.gz'

      - name: Package for Windows
        if: runner.os == 'Windows'
        run: |
          7z a 'otadump-${{ steps.get_version.outputs.value }}-${{ matrix.target }}.zip'
          LICENSE README.md
          ./target/${{ matrix.target }}/release/otadump.exe

      - name: Upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.target }}
          path: |
            *.tar.gz
            *.zip
